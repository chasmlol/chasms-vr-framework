[package]
name = "rustvr-xrsim"
description = "An emulated headset: an OpenXR runtime that plays a script (or live commands) for the head and controllers and saves what each eye would show, so VR apps can be playtested without a headset"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The runtime the OpenXR loader loads (`rustvr_xrsim.dll`, through `XR_RUNTIME_JSON`), and the
# library the `rustvr-xrsim` tool and the tests link.
[lib]
name = "rustvr_xrsim"
crate-type = ["cdylib", "rlib"]

[dependencies]
openxr-sys = "0.14"
rustvr-gpu.workspace = true
anyhow.workspace = true
glam.workspace = true
serde.workspace = true
toml.workspace = true
windows.workspace = true
