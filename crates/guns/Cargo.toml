[package]
name = "rustvr-guns"
description = "Guns from a game's models and rigs: weapon space, moving parts, the game's hands and their protocol descriptions"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rustvr-protocol.workspace = true
rustvr-asset.workspace = true
# The game's own hands on a gun (read from its arms models) and the grip -> hand mapping.
rustvr-avatar.workspace = true
rustvr-ik.workspace = true
# Kicks into weapon space.
rustvr-adapter.workspace = true
anyhow.workspace = true
bytemuck.workspace = true
glam.workspace = true
tracing.workspace = true
# Convex decomposition of a gun's model, for its collision (the same parry Rapier uses).
parry3d = "0.31"
