# Run: rustvr-xrsim run --dir runs/duel_chop --script tools/xrsim/duel_chop.toml -- rustvr-play.exe -- --arena duel --no-duelist (docs/DUEL.md)
# The longsword in two hands, raised overhead, chopped down slowly (0.8 s, speeding up over the
# first 0.3 s), the hands stopping dead at the chest; then again fast (0.3 s, up to speed in
# 0.12 s). Faster than the sword turns, it comes after the hands at its own pace along their way;
# the sword, the hands and the arms carry on a little past the stop, then settle on it.
# The right hand takes it from the table and lifts it; the left takes the handle below it in the
# air (13 cm down the handle, which leans 25 degrees down from the controller's line). With
# RUSTVR_DEBUG_MELEE=1 the runtime logs the held weapon's lag and turn off its hold every 3 frames.
# (Stage space: forward is -Z; a hand is [right, up, forward] from the head.)
