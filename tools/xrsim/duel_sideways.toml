# Run: rustvr-xrsim run --dir runs/duel_sideways --script tools/xrsim/duel_sideways.toml -- rustvr-play.exe -- --arena duel --no-duelist (docs/DUEL.md)
# The longsword in two hands held upright before the chest, then the left hand (lower on the
# handle) brought up level with the right and out to its left over a second, the wrists not turned:
# the handle lies along the line between the hands, so the blade turns from upright to pointing
# right; then back. The right hand takes it from the table and lifts it; the left takes the handle
# below it in the air (13 cm down the handle, which leans 25 degrees down from the controller's
# line). With RUSTVR_DEBUG_MELEE=1 the runtime logs how far its handle is off the hands' line.
# (Stage space: forward is -Z; a hand is [right, up, forward] from the head.)
