# The native-VR path end to end (tools/xrsim): rustvr-play with its test range on an emulated
# Quest 3 (Virtual Desktop's size, 90 Hz to start: the runtime asks for its highest, 120).
# - still, then a fast head turn, a sidestep and a walk on the stick: captures and a film of each,
#   to see the game's picture moved to every headset frame (`crate::warp`) and drawn for when it's
#   shown (prediction);
# - the captures' .toml has the refresh rate and the depth the headset got (`_depth.png`).
duration = 30
refresh = 90
eye_size = [2064, 2208]

[[key]]
t = 0
head = { pos = [0, 1.7, 0], yaw = 0, pitch = -5 }
left = { pos = [-0.2, -0.35, 0.3], yaw = 0, pitch = 0, squeeze = 0, stick = [0, 0] }
right = { pos = [0.2, -0.35, 0.3], yaw = 0, pitch = 0, squeeze = 0 }

[[key]]
t = 6
head = { yaw = 0 }

[[key]]
t = 6.6
head = { yaw = 60 }

[[key]]
t = 7.4
head = { yaw = 0 }

[[key]]
t = 10
head = { pos = [0, 1.7, 0] }

[[key]]
t = 10.5
head = { pos = [0.35, 1.7, 0] }

[[key]]
t = 11
head = { pos = [0, 1.7, 0] }

[[key]]
t = 14
left = { stick = [0, 0] }

[[key]]
t = 14.3
left = { stick = [0, 1] }

[[key]]
t = 18
left = { stick = [0, 1] }

[[key]]
t = 18.3
left = { stick = [0, 0] }

[[capture]]
t = 5
name = "still"

[[capture]]
t = 6.3
name = "turning"

[[capture]]
t = 10.25
name = "sidestep"

[[capture]]
t = 16
name = "walking"

[[film]]
t = 6
frames = 120
name = "turn"
every = 1
mip = 2

[[film]]
t = 15
frames = 48
name = "walk"
every = 1
mip = 2
