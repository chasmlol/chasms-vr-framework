# The user's headset as Virtual Desktop presents it (tools/xrsim): a Quest 3 at 3072x3264 an eye,
# 120 Hz, each frame's display time ~45 ms ahead (the stream's latency), and captures at full size.
# Leans round the near dummy, then walks on the stick past things: what the picture does when the
# head moves behind things, and whether it keeps the game's sharpness.
duration = 16
refresh = 120
latency_ms = 45
eye_size = [3072, 3264]
capture_width = 3072

[[key]]
t = 0
head = { pos = [0, 1.7, 0], yaw = 0, pitch = -5 }
left = { pos = [-0.2, -0.35, 0.3], yaw = 0, pitch = 0, squeeze = 0, stick = [0, 0] }
right = { pos = [0.2, -0.35, 0.3], yaw = 0, pitch = 0, squeeze = 0 }

[[key]]
t = 5
left = { stick = [0, 0] }

[[key]]
t = 5.1
left = { stick = [1, 0] }

[[key]]
t = 7.5
left = { stick = [1, 0] }

[[key]]
t = 7.6
left = { stick = [-1, 0] }

[[key]]
t = 12
left = { stick = [-1, 0] }

[[key]]
t = 12.1
left = { stick = [0, 0] }

[[capture]]
t = 6.5
name = "strafe_right"

[[capture]]
t = 9.5
name = "strafe_left"

[[film]]
t = 8.8
frames = 24
name = "strafe"
crop = [700, 1000, 1000, 900]
