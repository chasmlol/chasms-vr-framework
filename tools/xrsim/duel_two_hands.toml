# The longsword in two hands held upright before the chest, the hands close together on its handle:
# both wrists tilted 60 degrees forward and back (the wrists turn it: it tilts with them); then the
# left hand (lower on the handle) taken 32 cm out to the right hand's left, level with it, the wrists
# not turned (wide apart, the handle lies along the line between the hands: the blade turns to
# point right); then back. The right hand takes it from the table and lifts it; the left takes the
# handle below it in the air (13 cm down the handle, which leans 25 degrees down from the
# controller's line). With RUSTVR_DEBUG_MELEE=1 the runtime logs how far its handle is off the
# hands' line. (Stage space: forward is -Z; a hand is [right, up, forward] from the head.)
