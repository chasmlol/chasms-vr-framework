# Run: rustvr-xrsim run --dir runs/duel_parry --script tools/xrsim/duel_parry.toml -- rustvr-play.exe -- --arena duel --duel-test cue:right (docs/DUEL.md)
# The duel, cue mode (--duel-test cue:right): the duelist swings from its right (the player's left)
# (Stage space: forward is -Z; a hand is placed [right, up, forward] from the head.)
# each time a hand is raised over the head. The left hand takes the sword and holds it upright on
# the left.
# 1) Cue at 12: its wind-up (0.8 s, stepping in), its release from ~12.8. A push into it at 12.95-13.05
#    (inside the window it opens): a parry; then a step in and a forehand counter at 13.35-13.47.
# 2) Cue at 19: the push at 19.25 (0.6 s early: its window and recovery are over when the swing
#    comes at ~19.9); the blade held still in its way is beaten aside and the player struck.
