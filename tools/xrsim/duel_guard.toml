# Run: rustvr-xrsim run --dir runs/duel_guard --script tools/xrsim/duel_guard.toml -- rustvr-play.exe -- --arena duel --duel-test guard (docs/DUEL.md)
# The duel, guard mode (--duel-test guard): the duelist never swings but to riposte; it parries
# what it sees coming. (Stage space: forward is -Z; a hand is placed [right, up, forward] from the
# head, turned with its yaw.) The left hand takes the sword from the table.
# 3) At 12: a forehand from over the left shoulder, stepping in, readable (0.55 s): it parries it,
#    the sword's staggered; at 12.75 a second swing (low, at its legs) does nothing, and its riposte
#    lands.
# 4) At 18: the same forehand dragged: fast for its first part, then held while the body turns
#    away (18.18-18.55), then on round: its parry opens on the fast start and is over when the blade
#    comes; it lands.
duration = 23
capture_width = 960

