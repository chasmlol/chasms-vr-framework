# Run: rustvr-xrsim run --dir runs/duel_shoulder --script tools/xrsim/duel_shoulder.toml -- rustvr-play.exe -- --arena duel --no-duelist (docs/DUEL.md)
# The longsword in two hands laid back onto the right shoulder: the controllers pitched 195 (the
# blade 10 degrees above level, pointing back) put it through the shoulder, so it should rest on
# the shoulder (held off its hold by the body) rather than pass through. With RUSTVR_DEBUG_MELEE=1
# the log shows it held off its hold at rest. (The hands turn with the head: it stays ahead.)
# (Stage space: forward is -Z; a hand is [right, up, forward] from the head.)
duration = 30
capture_width = 960
