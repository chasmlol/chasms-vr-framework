# Duplet: a double-barrelled break-action shotgun (the barrels inside one big sleeve).
# * sights: none (a plain sleeve, no bead): the line of sight is the game's aim line, 2.8 cm over
#   the sleeve's top, between the barrels;
# * grip: 1.5 cm wide, 5.5 cm deep, nearly upright (5°);
# * action: a break action. The barrels (`stvol`, with the shells under it) turn about that bone's
#   origin, the hinge pin under the barrels at the front of the action (`rig_probe bones`), about
#   model +X: the game's own reload tips them 106.5° open, hanging straight down, and holds them
#   there while the shells go in (`export_viewmodel duplet --peaks anim_reload_begin_0`; its
#   closing motion swings them to 124° on the way, a flourish). The foregrip is on the barrels
#   (ahead of the hinge): the support hand pulls them open and pushes them shut;
# * chambers: the lower barrels' shells, the right barrel's first (it fires first), each bone's
#   origin its base at the breech face (z 0.6116); `mag_well` is the first's. A shell from the
#   pouch goes into each. The upper barrels' shells (`_u`, for the four-barrel upgrade the stock
#   gun doesn't have) and the reload's copies of all four (`patron_1`..`_4`, two of them floating
