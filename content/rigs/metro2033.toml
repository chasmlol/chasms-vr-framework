# Kalash 2012: a bullpup-styled Kalash with a horizontal 40-round magazine (`magazin`, its rounds
# `pula_*` under `hren_*`) lying in the top of the receiver, under the carry rail, and the
# collimator sight the game mounts on it from the first level (`att_kollimator` at
# `loc_kolimator`, as the game draws it; `metro-extract` mounts it).
# * sights: the collimator. Its body (mesh 5) sits on the rail; its lens is meshes 6..9, which
#   only the runtime draws (`hidden_meshes`, see RIGGING.md): the `night` and `distort` panes
#   (shaders the runtime doesn't reproduce: the collimator's own draw), the reflecting glass, and
#   the reticle quad 4.4 mm across. The line of sight is the collimator's axis: `loc_kolimator`'s
#   +Z (the mount's frame, square to the model's axes) through its origin (0.0970, 0, 0.7239),
#   which runs exactly through the reticle quad's centre (0.0970, 0, 0.7515); `rear_sight` and
#   `front_sight` are those two points (2.8 cm apart, both the game's own, so the direction is
#   exact). The iron sights under it (notch z 0.592, shoulders -0.0222; post tip -0.0226 at
#   z 0.865, the game's iron aim line) are 2.2 cm lower, below the collimator's window;
# * grip: a short pistol grip (2.9 cm wide, 3.5 cm deep, y -0.135..-0.15) running into a thumbhole
#   stock, so its rake is a guess (15°);
# * magazine well: the magazine's underside, where it drops into the receiver (no locator);
# * handle: `pumpachka`, a lever on the left side that the game swings 34° on every shot
#   (`export_viewmodel 2012 --peaks 2012_attack_0`) and 78° in the reload, about an axis along the
#   barrel (its bone's -Y); the runtime swings levers only about model +X, so the lever is grabbed
#   and pulled but stays still.
# Fire rate: the game's 900 rpm (config offset 392: 899.99994). Mass: an AK-12's 3.2 kg.
